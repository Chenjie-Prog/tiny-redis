[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-redis"
version = "0.1.0"
description = "A mini Redis server built from scratch on the pure Python standard library"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "tiny-redis contributors" }]
requires-python = ">=3.9"
keywords = ["redis", "resp", "server", "network-programming", "zero-dependency", "tutorial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: System :: Networking :: Servers",
]

[project.urls]
Homepage = "https://github.com/Chenjie-Prog/tiny-redis"
Repository = "https://github.com/Chenjie-Prog/tiny-redis"
Issues = "https://github.com/Chenjie-Prog/tiny-redis/issues"

[project.scripts]
tiny-redis-server = "tinyredis.__main__:main"

[tool.setuptools]
packages = ["tinyredis"]
